# Swing-Lock scanner configuration. All prices in dollars (0.43 == 43c).

fees:
  kalshi:
    # fee = round_up(multiplier * rate * C * P * (1 - P)); see docs/research/kalshi_api.md
    taker_rate: 0.07
    maker_rate: 0.0175          # only on series with fee_type quadratic_with_maker_fees
    default_multiplier: 1.0     # overridden per series by the API's fee_multiplier
    rounding_increment: 0.01    # retail accounts round fees up to the cent per order
  polymarket:                   # international venue, sports markets (taker only)
    taker_rate: 0.05            # fee/share = rate * p * (1 - p); see docs/research/other_venues.md
    rounding_increment: 0.0
  polymarket_us:
    taker_rate: 0.0695
    rounding_increment: 0.01    # unverified

execution:
  slippage: 0.0                 # dollars added to every ask fill (0.01 = 1c worse)
  max_contracts_per_trade: 100  # cap on arb size even when the book is deeper

backtest:
  entry_thresholds: [0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60]   # X: buy A at ask <= X
  lock_thresholds: [0.90, 0.92, 0.94, 0.95, 0.96, 0.97, 0.98, 0.99]           # Y: lock when cost <= Y
  contracts_per_entry: 10
  min_arb_profit: 0.0           # dollars per matched contract, after fees
  max_staleness_s: 60           # max age of the other side's quote in the A/B as-of join
  # Entry filters (null = off). min_minutes_to_close is LOOKAHEAD: diagnostic only, never gate-valid.
  min_entry_ask: null           # skip entries quoted below this (near-decided matches)
  max_minutes_from_start: null  # only enter up to N minutes after scheduled start (known live)
  min_minutes_to_close: null
  walkforward:
    min_train_months: 1
    train_months: null          # null = expanding window; N = rolling last N months
    min_train_trades: 10
    objective: total_pnl        # or mean_pnl
    select_slippage: 0.01       # choose rules on training data at 1c slippage
    slippages: [0.0, 0.01]      # out-of-sample evaluation

scanner:
  poll_seconds: 5
  min_arb_profit_per_contract: 0.005
  min_lock_profit: 0.05         # dollars, total, for a swing-lock alert
  positions_file: positions.json
  series:                       # tennis match-winner series to watch
    - KXATPMATCH
    - KXWTAMATCH
    - KXATPCHALLENGERMATCH
    - KXWTACHALLENGERMATCH
    - KXITFMATCH
    - KXITFWMATCH
  alert_log: data/alerts.log
  discovery_seconds: 300        # how often to re-list open matches
  min_request_interval: 1.0     # seconds between Kalshi requests
  realert_min_improvement: 0.05 # dollars of extra edge before re-alerting an open episode
  realert_min_improvement_pct: 0.25
  episode_gap_seconds: 30       # an opportunity gone this long starts a new episode

recorder:                       # python -m swinglock.collectors.recorder (deploy: --profile recorder)
  poll_s: 10                    # order-book snapshot interval
  discovery_s: 600              # re-list open matches
  flush_s: 60                   # write a parquet part file
  max_rps: 1.0                  # cap on all recorder requests (shares the VPS IP with the scanner)
  depth: 5                      # bid levels kept per book side
  score_poll_s: 60              # live score via /live_data/batch (1 req per ≤100 matches); 0 = off
  out_dir: data/recorded/kalshi

data:
  max_carry_s: 1800            # max age a candle leg is carried forward before it becomes NaN.
                                # Candles are written on quote changes, so an unchanged quote stays valid;
                                # the cap only guards against data gaps (halts, missing candles).
  raw_dir: data/raw
  processed_dir: data/processed
